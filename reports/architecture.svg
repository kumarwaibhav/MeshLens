<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="t"><title id="t">MeshLens system architecture</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#70918f"/></marker><style>.b{font:700 18px Arial,Helvetica,sans-serif}.s{font:14px Arial,Helvetica,sans-serif}.a{fill:none;stroke:#70918f;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1200" height="790" rx="18" fill="#f3f1e9"/><text x="40" y="47" class="b" fill="#193744" style="font-size:29px">MeshLens / from normal patterns to local inspection</text><text x="40" y="82" class="b" fill="#116c70" style="font-size:15px">01 OFFLINE LEARNING AND MEASUREMENT</text><rect x="40" y="105" width="250" height="110" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="57" y="134" class="b" fill="#193744">Fit / 160 normal</text><text x="57" y="159" class="s" fill="#193744">Learn reconstruction</text><text x="57" y="179" class="s" fill="#193744">Patch sampling stays in fit</text><rect x="330" y="105" width="250" height="110" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="347" y="134" class="b" fill="#193744">Tune / 52 normal</text><text x="347" y="159" class="s" fill="#193744">Compare candidates</text><text x="347" y="179" class="s" fill="#193744">Synthetic defects only</text><rect x="620" y="105" width="250" height="110" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="637" y="134" class="b" fill="#193744">Calibrate / 52 normal</text><text x="637" y="159" class="s" fill="#193744">Freeze the review threshold</text><text x="637" y="179" class="s" fill="#193744">Normal-tail operating point</text><rect x="910" y="105" width="250" height="110" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="927" y="134" class="b" fill="#193744">Test / 78 images</text><text x="927" y="159" class="s" fill="#193744">21 normal + 57 defects</text><text x="927" y="179" class="s" fill="#193744">Final evaluation only</text><path class="a" d="M165 215V247H310V272"/><path class="a" d="M455 215V247H310V272"/><rect x="185" y="280" width="250" height="110" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="202" y="309" class="b" fill="#193744">Train and select</text><text x="202" y="334" class="s" fill="#193744">Convolutional autoencoders</text><text x="202" y="354" class="s" fill="#193744">Normal + synthetic tune evidence</text><rect x="620" y="280" width="250" height="110" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="637" y="309" class="b" fill="#193744">Freeze decision rule</text><text x="637" y="334" class="s" fill="#193744">Chosen model + normal scores</text><text x="637" y="354" class="s" fill="#193744">Fixed threshold and score rule</text><rect x="910" y="280" width="250" height="110" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="927" y="309" class="b" fill="#193744">Measure performance</text><text x="927" y="334" class="s" fill="#193744">AUROC, PR, confusion counts</text><text x="927" y="354" class="s" fill="#193744">Failure and stress analysis</text><path class="a" d="M435 335H610"/><path class="a" d="M745 215V270"/><path class="a" d="M870 335H900"/><path class="a" d="M1035 215V270"/><text x="185" y="428" class="s" fill="#526d75">Python artifacts, experiment records, checksums, plots, notebook and report</text><path class="a" d="M745 390V466"/><rect x="450" y="475" width="590" height="73" rx="12" fill="#116c70" stroke="#c8d7d4"/><text x="467" y="504" class="b" fill="#fff">Frozen deployment assets</text><text x="467" y="529" class="s" fill="#fff">ONNX graph + metadata + measured results + real replay samples</text><text x="40" y="586" class="b" fill="#116c70" style="font-size:15px">02 REAL MODEL INFERENCE IN THE VISITOR'S BROWSER</text><rect x="40" y="611" width="250" height="105" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="57" y="640" class="b" fill="#193744">Decode and preprocess</text><text x="57" y="665" class="s" fill="#193744">RGB / 256 x 256 / Float32</text><text x="57" y="685" class="s" fill="#193744">Image or sampled camera frame</text><rect x="330" y="611" width="250" height="105" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="347" y="640" class="b" fill="#193744">Run ONNX autoencoder</text><text x="347" y="665" class="s" fill="#193744">Reconstruct normal patterns</text><text x="347" y="685" class="s" fill="#193744">Local WebAssembly runtime</text><rect x="620" y="611" width="250" height="105" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="637" y="640" class="b" fill="#193744">Score reconstruction</text><text x="637" y="665" class="s" fill="#193744">Squared RGB residual map</text><text x="637" y="685" class="s" fill="#193744">Mean high-error pixel residuals</text><rect x="910" y="611" width="250" height="105" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="927" y="640" class="b" fill="#193744">Review and record</text><text x="927" y="665" class="s" fill="#193744">Frozen threshold comparison</text><text x="927" y="685" class="s" fill="#193744">Local history and CSV export</text><path class="a" d="M290 663H320"/><path class="a" d="M580 663H610"/><path class="a" d="M870 663H900"/><text x="40" y="760" class="s" fill="#526d75">Images stay on the device. Error maps support review; they are not validated segmentation or probabilities.</text></svg>