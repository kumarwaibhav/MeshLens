<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="535" viewBox="0 0 1140 535" role="img" aria-labelledby="t"><title id="t">MeshLens convolutional autoencoder architecture</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#70918f"/></marker><style>.b{font:700 18px Arial,Helvetica,sans-serif}.s{font:14px Arial,Helvetica,sans-serif}.a{fill:none;stroke:#70918f;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1140" height="535" rx="18" fill="#f3f1e9"/><text x="35" y="44" class="b" fill="#193744" style="font-size:27px">MeshLens / convolutional autoencoder</text><rect x="35" y="82" width="240" height="132" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="52" y="111" class="b" fill="#193744">Input</text><text x="52" y="136" class="s" fill="#193744">RGB / Float32 [0, 1]</text><text x="52" y="156" class="s" fill="#193744">3 x 256 x 256</text><text x="52" y="176" class="s" fill="#193744">Fixed browser tensor</text><rect x="310" y="82" width="240" height="132" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="327" y="111" class="b" fill="#193744">Reflection padding</text><text x="327" y="136" class="s" fill="#193744">16 pixels on every side</text><text x="327" y="156" class="s" fill="#193744">3 x 288 x 288</text><text x="327" y="176" class="s" fill="#193744">Reduce boundary artifacts</text><rect x="585" y="82" width="240" height="132" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="602" y="111" class="b" fill="#193744">Convolutional encoder</text><text x="602" y="136" class="s" fill="#193744">Channels 3 &gt; 12 &gt; 16 &gt; 24</text><text x="602" y="156" class="s" fill="#193744">3 x 3 then 4 x 4 kernels</text><text x="602" y="176" class="s" fill="#193744">Stride 1, then 2, 2, 2</text><rect x="860" y="82" width="240" height="132" rx="12" fill="#116c70" stroke="#c8d7d4"/><text x="877" y="111" class="b" fill="#fff">Linear bottleneck</text><text x="877" y="136" class="s" fill="#fff">8 latent channels</text><text x="877" y="156" class="s" fill="#fff">36 x 36 spatial activations</text><text x="877" y="176" class="s" fill="#fff">Learned local texture code</text><path class="a" d="M275 148H300"/><path class="a" d="M550 148H575"/><path class="a" d="M825 148H850"/><path class="a" d="M980 214V292"/><rect x="860" y="302" width="240" height="132" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="877" y="331" class="b" fill="#193744">Decoder</text><text x="877" y="356" class="s" fill="#193744">Transpose convolutions</text><text x="877" y="376" class="s" fill="#193744">Channels 8 &gt; 24 &gt; 16 &gt; 12</text><text x="877" y="396" class="s" fill="#193744">Stride 2 at each upsample</text><rect x="585" y="302" width="240" height="132" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="602" y="331" class="b" fill="#193744">RGB reconstruction</text><text x="602" y="356" class="s" fill="#193744">3 x 3 RGB convolution</text><text x="602" y="376" class="s" fill="#193744">Sigmoid output [0, 1]</text><text x="602" y="396" class="s" fill="#193744">3 x 288 x 288</text><rect x="310" y="302" width="240" height="132" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="327" y="331" class="b" fill="#193744">Crop padded boundary</text><text x="327" y="356" class="s" fill="#193744">Remove 16-pixel margins</text><text x="327" y="376" class="s" fill="#193744">3 x 256 x 256</text><text x="327" y="396" class="s" fill="#193744">Compare with original input</text><rect x="35" y="302" width="240" height="132" rx="12" fill="#fff" stroke="#c8d7d4"/><text x="52" y="331" class="b" fill="#193744">Residual and score</text><text x="52" y="356" class="s" fill="#193744">Mean squared RGB error</text><text x="52" y="376" class="s" fill="#193744">Frozen high-error tail mean</text><text x="52" y="396" class="s" fill="#193744">Review if score &gt; threshold</text><path class="a" d="M860 368H835"/><path class="a" d="M585 368H560"/><path class="a" d="M310 368H285"/><path class="a" d="M155 214V292" stroke-dasharray="5 5"/><text x="171" y="261" class="s" fill="#526d75" style="font-size:12px">Original input</text><text x="35" y="484" class="s" fill="#526d75">Trained from random initialization on normal 64 x 64 patches. LeakyReLU hidden layers; linear bottleneck.</text><text x="35" y="511" class="s" fill="#526d75">The selected checkpoint, noise setting and score fraction are recorded with the frozen deployment graph.</text></svg>