<text x="40" y="598" font-size="20" fill="#536b62" font-weight="400" text-anchor="start">1100 px: tighter spacing and toolbars. 820 px: main grids stack. 600 px: compact navigation and controls.</text>
<text x="40" y="639" font-size="20" fill="#536b62" font-weight="400" text-anchor="start">Reduced motion, reduced transparency, dark appearance and forced-colors rules are present.</text>
<text x="40" y="687" font-size="20" fill="#a96524" font-weight="400" text-anchor="start">Current delivery includes fresh desktop captures. Physical phones, screen readers and camera hardware remain to test.</text>
