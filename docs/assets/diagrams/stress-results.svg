<text x="40" y="692" font-size="23" fill="#a96524" font-weight="700" text-anchor="start">A shift flagged every normal image. High recall alone can hide an unusable review workload.</text>
<text x="40" y="737" font-size="20" fill="#536b62" font-weight="400" text-anchor="start">No inconclusive inputs were recorded in these six conditions. Simulated stress is not a physical camera study.</text>
