name: checks

'on':
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_dataset:
        description: Download and verify the complete licensed research dataset
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '42'

jobs:
  test:
    name: Source and frozen-model checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frozen Python and verification dependencies
        run: python -m pip install --no-compile -r requirements-dev.lock
      - name: Install project without changing frozen dependencies
        run: python -m pip install --no-deps -e .
      - name: Install frozen browser runtime
        run: npm ci --ignore-scripts
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Test model, adversarial workflows, actual app lifecycle, build and server
        run: python scripts/verify_project.py
      - name: Lint source and regressions
        run: python -m ruff check src scripts tests
      - name: Run actual WebAssembly inference on all tracked real samples
        run: PYTHONPATH=src python scripts/verify_wasm.py
      - name: Verify active detector Python and browser parity on all 18 gallery images
        run: |
          rm -f reports/inspection/gallery-runtime-parity.json
          python scripts/verify_inspection_runtime.py
      - name: Build the verified release from the frozen assets
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            reports/verification-junit.xml
            reports/verification-node-junit.xml
            reports/verification.json
            reports/wasm-parity.json
            reports/inspection/gallery-runtime-parity.json

  dataset-audit:
    name: Full research-data audit
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.full_dataset)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --no-compile -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: npm ci --ignore-scripts
      - name: Download pinned data and verify its archive checksum
        run: python scripts/download_data.py
      - name: Confirm downloaded data preserve the committed manifest
        run: git diff --exit-code -- data/manifest.csv data/mask_checksums.json
      - name: Verify every image and mask against the committed manifest
        run: python -m pytest -q tests/test_data.py --junitxml=reports/data-audit-junit.xml
      - name: Run actual WebAssembly inference on every official test image
        run: PYTHONPATH=src python scripts/verify_wasm.py --full-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataset-audit-results
          path: |
            reports/data-audit-junit.xml
            reports/wasm-parity.json
